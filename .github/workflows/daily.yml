name: 宏利強積金每日監控推送
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
jobs:
  mpf-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [ -f mpf_bot.py ]; then python mpf_bot.py; else python mpf_x5f_bot.py; fi
