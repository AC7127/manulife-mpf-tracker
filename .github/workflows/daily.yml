name: 宏利強積金每日監控 + NBA完整板 (單檔版 - 修復2)

on:
  schedule:
    - cron: '30 1 * * *'
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  mpf-daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run MPF Bot (只在 09:30 / 手動)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 1 * * *'
        run: python mpf_x5f_bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

  nba-complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Debug files
        run: |
          pwd
          ls -lh
          ls -lh *.py || echo "no py in root"
          find . -maxdepth 2 -name "*.py" -ls
      - name: Run NBA Complete Bot - 單檔版
        run: |
          echo "Event: ${{ github.event_name }} Schedule: '${{ github.event.schedule }}'"
          FILE="nba_complete_bot.py"
          if [ ! -f "$FILE" ]; then
            echo "File $FILE not found in root, searching..."
            FOUND=$(find . -name "nba_complete_bot.py" | head -1)
            echo "Found: $FOUND"
            FILE="$FOUND"
          fi
          echo "Using file: $FILE"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual -> DAILY"
            NBA_MODE=daily python3 "$FILE" daily
          elif [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then
            echo "Daily cron -> DAILY"
            NBA_MODE=daily python3 "$FILE" daily
          else
            echo "Hourly cron -> HOURLY"
            NBA_MODE=hourly python3 "$FILE" hourly
          fi
        env:
          NBA_BOT_TOKEN: ${{ secrets.NBA_BOT_TOKEN }}
          NBA_CHAT_ID: ${{ secrets.NBA_CHAT_ID }}