name: MPF Daily V13.1 Fixed
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
jobs:
  mpf-daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run bot V13.1
        run: python mpf_x5f_bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Commit JSON
        run: |
          git config user.name "MPF Bot V13.1"
          git config user.email "bot@mpf.local"
          git add prices.json || echo "no json"
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "auto V13.1 04/11 true price"
          git push || echo "push fail but telegram sent"
