name: 宏利強積金每日監控 + NBA完整板 (單檔版 - 已修復)

on:
  schedule:
    - cron: '30 1 * * *' # 每日 09:30 HKT - 詳細戰績榜+詳細新聞
    - cron: '0 * * * *'  # 每小時 - 每場戰況
  workflow_dispatch:

jobs:
  mpf-daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run MPF Bot (只在 09:30 / 手動)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 1 * * *'
        run: python mpf_x5f_bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

  nba-complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run NBA Complete Bot - 單檔版 (自動判斷每日/每小時)
        run: |
          ls -lh *.py
          echo "Event: ${{ github.event_name }} Schedule: '${{ github.event.schedule }}'"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual -> DAILY mode (完整榜+詳細新聞)"
            NBA_MODE=daily python nba_complete_bot.py daily
          elif [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then
            echo "Daily cron -> DAILY mode"
            NBA_MODE=daily python nba_complete_bot.py daily
          else
            echo "Hourly cron -> HOURLY mode (即時戰況)"
            NBA_MODE=hourly python nba_complete_bot.py hourly
          fi
        env:
          NBA_BOT_TOKEN: ${{ secrets.NBA_BOT_TOKEN }}
          NBA_CHAT_ID: ${{ secrets.NBA_CHAT_ID }}