name: 宏利強積金每日監控推送 V8全29隻
on:
  schedule:
    - cron: '30 1 * * *'  # 09:30 HKT
  workflow_dispatch:

jobs:
  mpf-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python mpf_x5f_bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Commit prices.json
        run: |
          git config user.name "MPF Bot"
          git config user.email "bot@mpf.local"
          git add prices.json || true
          git diff --staged --quiet || git commit -m "auto: update prices.json $(date +%Y-%m-%d)"
          git push || true
