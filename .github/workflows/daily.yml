name: 宏利強積金每日監控 V9旗艦優化版
on:
  schedule:
    - cron: '30 1 * * *'  # 09:30 HKT
  workflow_dispatch:
jobs:
  mpf-daily-v9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python mpf_x5f_bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Commit prices.json + history
        run: |
          git config user.name "MPF Bot V9"
          git config user.email "bot-v9@mpf.local"
          git add prices.json prices_history.json || true
          git diff --staged --quiet || git commit -m "auto V9: update prices + history $(date +%Y-%m-%d) - 3重數據源+歷史追蹤"
          git push || true
