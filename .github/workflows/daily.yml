name: 宏利強積金每日監控推送

on:
  schedule:
    - cron: '30 1 * * *'  # 09:30 HKT = 01:30 UTC 你成功時間
  workflow_dispatch:

jobs:
  mpf-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run MPF Bot V5 with suggestions
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          echo "=== 檢查檔案 ==="
          ls -lh *.py
          echo "=== Python 版本 ==="
          python --version
          echo "=== 執行 Bot ==="
          if [ -f "mpf_bot_v5_suggestions.py" ]; then
            echo "✅ 找到 v5 建議版"
            python mpf_bot_v5_suggestions.py
          elif [ -f "mpf_x5f_bot.py" ]; then
            echo "✅ 找到 mpf_x5f_bot.py"
            python mpf_x5f_bot.py
          else
            echo "❌ 無 Bot 檔"
            exit 1
          fi
