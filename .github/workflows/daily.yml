name: 宏利強積金每日監控 + NBA完整板 (單檔版)

on:
  schedule:
    - cron: '30 1 * * *' # 每日 09:30 HKT - 詳細戰績榜+詳細新聞
    - cron: '0 * * * *'  # 每小時 - 每場戰況
  workflow_dispatch:

jobs:
  mpf-daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run MPF Bot (只在 09:30)
        if: github.event.schedule == '30 1 * * *' || github.event_name == 'workflow_dispatch'
        run: python mpf_x5f_bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

  nba-complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run NBA Complete Bot - 每日09:30詳細榜+新聞 / 每小時戰況 (單檔)
        run: |
          if [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then
            NBA_MODE=daily python nba_complete_bot.py daily
          else
            NBA_MODE=hourly python nba_complete_bot.py hourly
          fi
        env:
          NBA_BOT_TOKEN: ${{ secrets.NBA_BOT_TOKEN }}
          NBA_CHAT_ID: ${{ secrets.NBA_CHAT_ID }}
