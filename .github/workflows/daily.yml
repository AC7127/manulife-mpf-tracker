name: 宏利強積金每日監控 + NBA完整板 (已暫停每小時)

on:
  schedule:
    - cron: '30 1 * * *' # 每日 09:30 HKT - 詳細戰績榜+詳細新聞 (已暫停每小時)
  workflow_dispatch:

jobs:
  mpf-daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run MPF Bot (09:30 或手動)
        run: python mpf_x5f_bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

  nba-complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run NBA Complete Bot - 每日09:30完整版 (已暫停每小時)
        run: |
          echo ">>> DAILY mode - 09:30 完整30隊榜+詳細新聞 (每小時已暫停)"
          NBA_MODE=daily python3 nba_complete_bot.py daily
        env:
          NBA_BOT_TOKEN: ${{ secrets.NBA_BOT_TOKEN }}
          NBA_CHAT_ID: ${{ secrets.NBA_CHAT_ID }}
