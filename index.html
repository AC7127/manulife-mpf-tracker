}
.font-tc{
  font-family:"Noto Sans TC","PingFang HK","Microsoft JhengHei",sans-serif
}
::-webkit-scrollbar{
  width:9px;
  height:9px
}
::-webkit-scrollbar-thumb{
  background:var(--line);
  border-radius:99px
}
button,input,select{
  font:inherit
}
button{
  cursor:pointer
}
a{
  color:inherit
}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow)
}
.chip{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:999px;
  padding:7px 12px;
  font-size:13px;
  font-weight:600;
  color:var(--muted)
}
.chip.active{
  background:var(--navy);
  color:#fff;
  border-color:var(--navy)
}
[data-theme="dark"] .chip.active{
  background:#edf3fa;
  color:#071222;
  border-color:#edf3fa
}
.input{
  width:100%;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:11px;
  padding:11px 12px 11px 38px;
  outline:none
}
.input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(23,99,200,.16)
}
select{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:10px;
  padding:10px 12px;
  font-weight:600
}
.hover\:-translate-y-0\.5:hover{
  --tw-translate-y: -0.125rem;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

  }
  .sm\:inline{
    display: inline;
  }
  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .sm\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .sm\:p-4{
    padding: 1rem;
  }
  .sm\:p-5{
    padding: 1.25rem;
  }
  .sm\:p-6{
    padding: 1.5rem;
  }
  .sm\:px-5{
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }
  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }
  .sm\:py-6{
    padding-top: 1.5rem;
    padding-bottom: 1.5rem;
  }
  .sm\:pb-5{
    padding-bottom: 1.25rem;
  }
  .sm\:text-3xl{
    font-size: 1.875rem;
    line-height: 2.25rem;
  }
  .sm\:text-\[19px\]{
    font-size: 19px;
  }
  .sm\:text-\[20px\]{
    font-size: 20px;
  }
  .sm\:text-\[22px\]{
    font-size: 22px;
  }
  .sm\:text-\[28px\]{
    font-size: 28px;
  }
  .sm\:text-base{
    font-size: 1rem;
    line-height: 1.5rem;
  }
  .sm\:text-xs{
    font-size: 0.75rem;
    line-height: 1rem;
  }
}
@media (min-width: 768px){
  .md\:block{
    display: block;
  }
  .md\:inline{
    display: inline;
  }
  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
@media (min-width: 1024px){
  .lg\:col-span-1{
    grid-column: span 1 / span 1;
  }
  .lg\:col-span-2{
    grid-column: span 2 / span 2;
  }
  .lg\:block{
    display: block;
  }
  .lg\:inline-flex{
    display: inline-flex;
  }
  .lg\:grid-cols-1{
    grid-template-columns: repeat(1, minmax(0, 1fr));
  }
  .lg\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
